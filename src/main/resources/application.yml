server:
  port: 6005

spring:
  application:
    name: apigatewayexculsive

  cloud:
    gateway:
      server:
        webmvc:
          add-to-simple-url-handler-mapping: true

          routes:
            - id: login-client
              uri: lb://loginservice
              predicates:
                - Path=/api/auth/**

            - id: issues-client
              uri: lb://issueservice
              predicates:
                - Path=/issues,/issues/**

            - id: projects-client
              uri: lb://ProjectsMicroService
              predicates:
                - Path=/projects,/projects/**

            - id: notifications-client
              uri: lb://notificationservice
              predicates:
                - Path=/api/notifications,/api/notifications/**,/ws-notifications,/ws-notifications/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8666/eureka/
