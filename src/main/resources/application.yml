server:
  port: 6005

spring:
  application:
    name: apigatewayexculsive

  cloud:
    gateway:
      server:
        webflux:
          # Required for WebSocket routing: it registers the gateway's handler
          # mapping so ws:// upgrades are matched against the routes above.
          add-to-simple-url-handler-mapping: true

          routes:
            - id: login-client
              uri: lb://loginservice
              predicates:
                - Path=/api/auth/**

            - id: issues-client
              uri: lb://issueservice
              predicates:
                - Path=/issues,/issues/**

            - id: projects-client
              uri: lb://ProjectsMicroService
              predicates:
                - Path=/projects,/projects/**

            - id: notifications-client
              uri: lb://notificationservice
              predicates:
                - Path=/api/notifications,/api/notifications/**,/ws-notifications,/ws-notifications/**
              # The gateway's CorsFilter is the single CORS authority. Left intact,
              # the SockJS endpoint downstream adds its own Access-Control-* headers
              # and the browser rejects the response for "multiple values". Dropping
              # Origin on the forwarded hop stops it doing CORS processing at all.
              filters:
                - RemoveRequestHeader=Origin

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8666/eureka/}

# JWT Configuration - must match LoginMicroService secret
jwt:
  secret: ${JWT_SECRET:aVeryLongAndSecure256BitSecretKeyForJWTSigningPurposes123456}
  expiration-ms: ${JWT_EXPIRATION_MS:1800000}
